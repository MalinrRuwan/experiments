apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thunderid
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/thunderid-deployment.git
    targetRevision: main
    path: manifests/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  revisionHistoryLimit: 3
