server:
  ha:
    enabled: true
    replicas: 3

    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable     = 1
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}

        seal "awskms" {
          region     = "REPLACE_WITH_REGION"
          kms_key_id = "REPLACE_WITH_KMS_KEY_ID"
        }

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: local-path

  nodeSelector:
    role: worker

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
